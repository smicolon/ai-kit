name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run --filter @smicolon/ai-kit typecheck

      - name: Build
        run: bun run --filter @smicolon/ai-kit build

      - name: Run CLI unit tests
        run: bun test packages/cli

      - name: Validate pack structure
        run: bash tests/test-plugin-structure.sh

      - name: Verify CLI runs
        run: node packages/cli/dist/index.js --help

